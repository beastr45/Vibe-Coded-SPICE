[workspace]
members = [
    "crates/spice-core",
    "crates/spice-cli",
    "apps/spice-studio/src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.1", features = [] }
thiserror = "2.0"
